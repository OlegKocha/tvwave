appId: tv.tvwave.app.debug
---
- runFlow: recovery-open.yaml
- extendedWaitUntil:
    visible: "Восстанавливаем эфир.*"
    timeout: 20000
- takeScreenshot: recovery-attempt
- extendedWaitUntil:
    visible:
      id: playback-status
      text: 'Связь с каналом прервалась.*'
    timeout: 90000
- assertVisible: 'Повторить'
- assertVisible:
    id: player-pause
    focused: true
- takeScreenshot: retries-exhausted
