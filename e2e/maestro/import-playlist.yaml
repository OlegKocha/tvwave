- assertVisible:
    id: add
    focused: true
- pressKey: Remote Dpad Center
- assertVisible:
    id: source-url
    focused: true
- pressKey: Remote Dpad Center
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Center
- inputText: "http://10.0.2.2:8765/invalid.m3u8"
- hideKeyboard
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Down
- assertVisible:
    id: validate
    focused: true
- pressKey: Remote Dpad Center
- assertVisible: ".*отсутствует заголовок.*"
- pressKey: Remote Dpad Up
- pressKey: Remote Dpad Up
- pressKey: Remote Dpad Center
- eraseText
- inputText: "http://10.0.2.2:8765/playlist.m3u8"
- hideKeyboard
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Center
- assertVisible:
    id: source-add
    focused: true
- pressKey: Remote Dpad Center
- assertVisible: "Все каналы · 16"
