appId: tv.tvwave.app.debug
---
- runFlow: steps/open-export.yaml
- assertVisible:
    id: file-access-dialog
- pressKey: back
- assertNotVisible:
    id: file-access-dialog
- assertVisible:
    id: export
    focused: true
- pressKey: Remote Dpad Center
- runFlow: steps/allow-tv-wave.yaml
- extendedWaitUntil:
    visible: ".*Копия проверена и сохранена.*"
    timeout: 15000
- assertNotVisible:
    id: file-access-dialog
- takeScreenshot: backup-export-granted
