appId: tv.tvwave.app.debug
---
- assertVisible:
    id: file-access-dialog
- tapOn:
    id: file-access-settings
- repeat:
    times: 10
    while:
      notVisible: "Not allowed"
    commands:
      - pressKey: Remote Dpad Down
- tapOn: "Not allowed"
- pressKey: back
- extendedWaitUntil:
    visible: ".*Копия проверена и сохранена.*"
    timeout: 15000
- assertNotVisible:
    id: file-access-dialog
- takeScreenshot: backup-export-granted
