appId: tv.tvwave.app.debug
---
- launchApp:
    permissions:
      all: unset
- assertVisible:
    id: guide-brand
- pressKey: Remote Dpad Down
- pressKey: back
- assertVisible:
    id: "group:Все каналы"
    focused: true
- pressKey: back
- assertVisible:
    id: main-tv
    focused: true
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Down
- assertVisible:
    id: main-settings
    focused: true
- pressKey: Remote Dpad Center
- assertVisible:
    id: playlists
    focused: true
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Center
- assertVisible: "Телепрограммы"
- pressKey: back
- repeat:
    times: 5
    commands:
      - pressKey: Remote Dpad Down
- assertVisible:
    id: backup
    focused: true
- pressKey: Remote Dpad Center
- assertVisible:
    id: export
    focused: true
- pressKey: Remote Dpad Center
