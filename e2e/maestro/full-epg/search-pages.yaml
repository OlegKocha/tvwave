appId: tv.tvwave.app.debug
---
- launchApp
- assertVisible:
    id: guide-brand
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Left
- pressKey: Remote Dpad Left
- pressKey: Remote Dpad Up
- assertVisible:
    id: main-search
    focused: true
- pressKey: Remote Dpad Center
- pressKey: Remote Dpad Center
- inputText: Marathon
- assertNotVisible:
    id: search-programmes-heading
- pressKey: Enter
- assertVisible: "Передачи · показано 200"
- assertVisible:
    id: search-detail-title
    text: Marathon final
# From the tabs the first Down selects row 1. The 200th selects the last
# programme on this page. Use the TV remote to open it and return to it.
- repeat:
    times: 200
    commands:
      - pressKey: Remote Dpad Down
- assertVisible:
    id: search-detail-title
    text: Marathon 204
- pressKey: Remote Dpad Center
- assertVisible:
    id: details-title
    text: Marathon 204
- pressKey: back
- assertVisible:
    id: search-detail-title
    text: Marathon 204
- pressKey: Remote Dpad Down
- assertVisible:
    id: search-more
    focused: true
- assertVisible: Продолжить поиск дальше
- assertVisible: "Передачи · показано 200"
- pressKey: Remote Dpad Center
- assertVisible: "Передачи · показано 400"
- assertVisible:
    id: search-detail-title
    text: Marathon 203
- pressKey: Remote Dpad Up
- assertVisible:
    id: search-detail-title
    text: Marathon 204
- pressKey: Remote Dpad Down
- assertVisible:
    id: search-detail-title
    text: Marathon 203
- pressKey: Remote Dpad Center
- assertVisible:
    id: details-title
    text: Marathon 203
- pressKey: back
- assertVisible:
    id: search-detail-title
    text: Marathon 203
# Row 201 is selected after returning from its details. Move past row 400.
- repeat:
    times: 200
    commands:
      - pressKey: Remote Dpad Down
- assertVisible:
    id: search-more
    focused: true
- pressKey: Remote Dpad Center
- assertVisible: "Передачи · показано 403"
- assertVisible:
    id: search-detail-title
    text: Marathon 003
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Down
- assertVisible:
    id: search-detail-title
    text: Marathon 001
- assertVisible: "Больше совпадений нет"
- assertNotVisible:
    id: search-more
- takeScreenshot: search-403-results
