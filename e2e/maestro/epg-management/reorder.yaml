appId: tv.tvwave.app.debug
---
- runFlow: ../open-epg.yaml
- pressKey: Remote Dpad Center
- pressKey: Remote Dpad Up
- pressKey: Remote Dpad Up
- assertVisible:
    id: epg-order
    focused: true
- pressKey: Remote Dpad Center
- assertVisible:
    text: '1. EPG 01'
- pressKey: Remote Dpad Center
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Down
- assertVisible: '3. EPG 01'
- assertVisible: '1. EPG 02'
- takeScreenshot: reordered-moving
# Back saves even while the item is held.
- pressKey: back
- assertVisible: 'Источник EPG'
- pressKey: back
- stopApp
- runFlow: ../open-epg.yaml
- assertVisible: 'EPG 02'
- pressKey: Remote Dpad Center
- pressKey: Remote Dpad Up
- pressKey: Remote Dpad Up
- pressKey: Remote Dpad Center
- assertVisible: '1. EPG 02'
# Back without changes keeps the same order.
- pressKey: back
