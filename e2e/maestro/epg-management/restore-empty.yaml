appId: tv.tvwave.app.debug
---
- stopApp
- launchApp
- runFlow:
    when:
      visible:
        id: "language:ru"
    commands:
      - tapOn:
          id: "language:ru"
- assertVisible: 'Ваши каналы — здесь'
- tapOn:
    id: restore
- assertVisible:
    id: file-list
- assertNotVisible:
    id: export
- tapOn:
    id: 'file:/storage/emulated/0/Download/TVWave-QA'
- assertVisible:
    id: 'file:/storage/emulated/0/Download/TVWave-QA/00-corrupt.tvwb'
    focused: true
# Left goes to the parent and retains the folder focus. Right enters it again.
- pressKey: Remote Dpad Left
- assertVisible:
    id: 'file:/storage/emulated/0/Download/TVWave-QA'
    focused: true
- pressKey: Remote Dpad Right
- assertVisible:
    id: 'file:/storage/emulated/0/Download/TVWave-QA/00-corrupt.tvwb'
    focused: true
# Right on a file focuses metadata, not restore. Repeated Right stays there.
- pressKey: Remote Dpad Right
- assertVisible:
    id: file-details
    focused: true
- pressKey: Remote Dpad Right
- assertVisible:
    id: file-details
    focused: true
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Up
- assertVisible:
    id: file-details
    focused: true
- assertNotVisible:
    id: restore-apply
- takeScreenshot: file-metadata-focused
- pressKey: Remote Dpad Left
- assertVisible:
    id: 'file:/storage/emulated/0/Download/TVWave-QA/00-corrupt.tvwb'
    focused: true
- pressKey: Remote Dpad Center
- assertVisible: '.*Резервная копия повреждена.*'
- assertVisible:
    id: restore-apply
    enabled: false
- assertVisible:
    id: file-error
- assertVisible:
    id: restore-cancel
    focused: true
- pressKey: Remote Dpad Left
- pressKey: Remote Dpad Down
- assertVisible:
    id: 'file:/storage/emulated/0/Download/TVWave-QA/01-valid.tvwb'
    focused: true
- pressKey: Remote Dpad Right
- assertVisible:
    id: file-details
    focused: true
- pressKey: back
- assertVisible:
    id: 'file:/storage/emulated/0/Download/TVWave-QA/01-valid.tvwb'
    focused: true
- pressKey: Remote Dpad Right
- pressKey: Remote Dpad Center
- assertVisible: 'Копия проверена'
- assertVisible:
    id: file-list
- assertVisible:
    id: restore-apply
    enabled: true
    focused: true
- assertVisible: '.*Плейлистов: 3.*'
- assertVisible: '.*Источников EPG: 3.*'
- takeScreenshot: restore-preview
- tapOn:
    id: restore-apply
- assertVisible: 'Все каналы · 48'
- stopApp
- launchApp
- assertVisible: 'Все каналы · 48'
- takeScreenshot: restored-after-reinstall
