appId: tv.tvwave.app.debug
---
- runFlow: ../programmes/start-preview.yaml
- pressKey: Remote Dpad Center
- pressKey: Remote Media Play Pause
# Channel stepping is active with the HUD hidden.
- pressKey: back
- pressKey: Remote Dpad Down
- pressKey: Remote Media Play Pause
- assertVisible: 'Тестовый канал 2'
- pressKey: back
- pressKey: Remote Dpad Down
- pressKey: Remote Media Play Pause
- assertVisible: 'Тестовый канал 3'
- pressKey: Remote Dpad Right
- pressKey: Remote Dpad Right
- assertVisible:
    id: player-favourite
    focused: true
- pressKey: Remote Dpad Center
- pressKey: back
- pressKey: back
- pressKey: back
- pressKey: back
- assertVisible:
    id: main-tv
    focused: true
- pressKey: Remote Dpad Down
- pressKey: Remote Dpad Center
- assertVisible: 'Избранное · 1'
- pressKey: back
- pressKey: back
- pressKey: Remote Dpad Up
- pressKey: Remote Dpad Up
- pressKey: Remote Dpad Center
- assertVisible:
    id: search-input
    focused: true
- pressKey: Remote Dpad Center
- inputText: '16'
- assertNotVisible:
    id: search-channels-heading
- pressKey: Enter
- assertVisible: 'Каналы · 1'
- assertVisible:
    id: search-results
    focused: true
- pressKey: Remote Dpad Center
- assertVisible: 'Все каналы · 16'
- pressKey: back
- pressKey: back
- tapOn:
    id: main-search
- assertVisible:
    id: search-recent-heading
- assertVisible:
    id: 'search-hit:recent:16'
- assertNotVisible:
    id: search-channels-heading
- pressKey: Remote Dpad Right
- pressKey: Remote Dpad Center
- assertVisible: 'Каналы · 1'
- tapOn:
    id: main-tv
- pressKey: back
- pressKey: back
- tapOn:
    id: main-search
- pressKey: Remote Dpad Down
- assertVisible:
    id: main-tv
    focused: true
- pressKey: Remote Dpad Down
- assertVisible:
    id: main-favourites
    focused: true
- pressKey: Remote Dpad Up
- pressKey: Remote Dpad Up
- pressKey: Remote Dpad Right
- assertVisible:
    id: search-results
    focused: true
- assertVisible:
    id: search-recent-heading
